[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=output/reports/allure-results
    --clean-alluredir

markers =
    smoke: быстрые тесты для проверки основной функциональности
    regression: полный набор регрессионных тестов
    auth: тесты авторизации
    inventory: тесты страницы товаров
    cart: тесты корзины
    checkout: тесты оформления заказа
    ui: тесты интерфейса
    performance: тесты производительности
    cross_browser: кросс-браузерные тесты
    e2e: end-to-end тесты
    high: высокий приоритет
    medium: средний приоритет
    low: низкий приоритет

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S
